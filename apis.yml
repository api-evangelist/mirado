name: Mirado
description: >-
  Mirado is a modern rewards platform that connects marketers and publishers
  with consumers through a network of more than 100 million cardholders. It
  delivers targeted, card-linked offers through publisher audiences and gives
  marketers full transparency into attributed, incremental sales using
  first-party card and bank data. Marketers reach new audiences and drive
  revenue at lower advertising cost, while publishers monetize their audiences
  through rewarding customer experiences. Mirado is an early-stage company
  backed by Version One Ventures. As of this enrichment pass it publishes a
  marketing and onboarding presence at mirado.ai (marketers, publishers, about,
  blog, get-started) but no public developer portal, API documentation, or
  machine-readable API surface.
